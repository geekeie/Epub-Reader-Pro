<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Reader Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EPUB Reader Pro</h1>
            <div class="controls">
                <input type="file" id="fileInput" accept=".epub" style="display: none;">
                <button id="uploadBtn" class="btn">Upload EPUB</button>
                <button id="prevBtn" class="btn">Previous</button>
                <button id="nextBtn" class="btn">Next</button>
            </div>
        </div>
        <div id="viewer"></div>
        <div id="loading" class="loading">Loading EPUB...</div>
        <div id="error" class="error" style="display: none;"></div>
    </div>
    
    <!-- EPUB.js Library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
