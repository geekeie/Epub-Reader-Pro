<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB to PDF Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EPUB to PDF Converter</h1>
            <p class="subtitle">Convert your EPUB files to PDF format</p>
        </div>
        
        <div id="converter" class="converter">
            <div class="upload-area">
                <input type="file" id="fileInput" accept=".epub" style="display: none;">
                <button id="uploadBtn" class="btn btn-primary">Select EPUB File</button>
                <p id="fileName" class="file-name"></p>
            </div>
            
            <button id="convertButton" class="btn btn-convert" disabled>Convert to PDF</button>
            
            <div id="progress" class="progress" style="display: none;">
                <div class="progress-bar">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
                <p id="progressText" class="progress-text">Processing...</p>
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
            <div id="success" class="success" style="display: none;"></div>
        </div>
    </div>
    
    <!-- Required libraries from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="converter.js"></script>
</body>
</html>
